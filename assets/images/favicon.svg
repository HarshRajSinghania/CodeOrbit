<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favPlanet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="favRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="#080D1B" />
  <circle cx="16" cy="16" r="8" fill="url(#favPlanet)" />
  <!-- Ring ellipse -->
  <ellipse cx="16" cy="16" rx="13" ry="5" transform="rotate(-25 16 16)" stroke="url(#favRing)" stroke-width="2" fill="none" />
  <!-- Sparkle satellite -->
  <circle cx="25" cy="12" r="2" fill="#F97316" />
  <circle cx="25" cy="12" r="0.8" fill="#FFFFFF" />
  <!-- Small code dot -->
  <circle cx="16" cy="16" r="1.5" fill="#FFFFFF" />
</svg>
