<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Core Planet Gradient -->
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Orbital Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.3" />
    </linearGradient>

    <!-- Atmosphere Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080D1B" stop-opacity="0" />
    </radialGradient>
    
    <!-- Code Bracket Gradient -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="50" cy="50" r="46" fill="url(#glowGrad)" />

  <!-- Back Orbit Segment (Behind Planet) -->
  <path d="M 12 60 A 42 16 -30 0 1 85 36" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 2" opacity="0.5" />

  <!-- Central Planet Shadow / Atmosphere -->
  <circle cx="50" cy="50" r="24" fill="#0E1528" stroke="#25314A" stroke-width="1.5" />
  
  <!-- Central Planet Body with Vibrant Gradient -->
  <circle cx="50" cy="50" r="22" fill="url(#planetGrad)" />

  <!-- Planetary Surface Curvature Lines -->
  <path d="M 30 44 C 36 38, 64 38, 70 44" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2" fill="none" />
  <path d="M 28 52 C 36 46, 64 46, 72 52" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.2" fill="none" />
  <path d="M 32 60 C 40 56, 60 56, 68 60" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2" fill="none" />

  <!-- Center Stylized Code Symbol: < / > -->
  <path d="M 44 45 L 39 50 L 44 55" stroke="url(#codeGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 56 45 L 61 50 L 56 55" stroke="url(#codeGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="50" r="1.5" fill="#38BDF8" />

  <!-- Front Orbit Segment (In Front of Planet) -->
  <path d="M 85 36 A 42 16 -30 0 1 12 60" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Orbiting Satellite Node / Momentum Bead -->
  <circle cx="82" cy="40" r="4" fill="#F97316" />
  <circle cx="82" cy="40" r="2" fill="#FFFFFF" />
  <circle cx="82" cy="40" r="6" stroke="#F97316" stroke-width="0.8" opacity="0.6" />

  <!-- Secondary Mini Orbit Bead -->
  <circle cx="20" cy="58" r="2.5" fill="#38BDF8" />
  <circle cx="20" cy="58" r="1" fill="#FFFFFF" />
</svg>
