# Dependabot Configuration for CodeOrbit
# Automated updates for GitHub Actions CI/CD workflows
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
